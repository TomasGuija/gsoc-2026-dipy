<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {%- seo -%}
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}" />
    {%- feed_meta -%} {%- if jekyll.environment == 'production' and
    site.google_analytics -%} {%- include google-analytics.html -%} {%- endif
    -%}
    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        const systemTheme =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : systemTheme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>

  <body>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Change color theme"
      title="Change color theme"
    >
      <svg
        class="theme-icon theme-icon-moon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M21 15.2A9 9 0 1 1 8.8 3a7 7 0 0 0 12.2 12.2Z" />
      </svg>
      <svg
        class="theme-icon theme-icon-sun"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"
        />
      </svg>
    </button>
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <article class="post">
          <header class="post-header">
            <h1 class="post-title" style="text-align: center">
              {{ page.title | escape }}
            </h1>
          </header>

          <div class="post-content">{{ content }}</div>
        </article>
      </div>
    </main>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const updateThemeToggleLabel = () => {
        const nextTheme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        const label = `Switch to ${nextTheme} mode`;
        themeToggle.setAttribute("aria-label", label);
        themeToggle.setAttribute("title", label);
      };

      themeToggle.addEventListener("click", () => {
        const theme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        localStorage.setItem("theme", theme);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        updateThemeToggleLabel();
      });
      updateThemeToggleLabel();
    </script>
  </body>
</html>
